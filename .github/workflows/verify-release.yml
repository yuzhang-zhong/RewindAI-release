name: Verify public source release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Rewind-reigns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Rewind-reigns/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run build && npm run postbuild:check
      - run: npm run smoke:session && npm run smoke:bridge && npm run smoke:grounding && npm run smoke:generator-auth && npm run smoke:standalone-api
      - run: npx playwright install --with-deps chromium
      - name: Browser-only preset-deck regression
        run: |
          npm run dev > /tmp/rewindai-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:5174/api/health");if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)'
          npm run smoke:standalone-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-browser-evidence
          path: Rewind-reigns/test-results/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: StorySage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.test.txt
      - run: python -m pytest tests/utils tests/biography tests/session_agenda
      - run: python scripts/smoke_rewindai_backend.py

  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: StorySage_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: StorySage_Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run smoke:rewindai-ui
      # Full npm audit has known legacy build-tool findings. See release notes;
      # this build/test job does not certify the dependency graph as clean.
